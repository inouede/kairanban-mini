/* ★★★ 必須通知モーダルのスタイル ★★★ */
.notification-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    animation: fadeIn 0.3s ease-in-out;
}

.notification-modal-content {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    animation: slideUp 0.3s ease-out;
}

.shake {
    animation: shake 0.5s;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

.notification-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.allow-button {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    padding: 18px;

.allow-button:hover {

    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
}

.allow-button:active {

}

.allow-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

<script>
'use strict';

// ============================================
// グローバル変数
// ============================================
window.LESSQ_NOTIFICATION = {
  modalShown: false,
  isIOS: false,
  vapidPublicKey: 'BOD-84nzA76xfIQfOON7P9AQeciAsf8GjNsg_25UDDiGI1WWVeY3jJy_GLUo2UD5Zn-9ur-P5MXhc_HSLjgWxI0',
  debugLog: []
};

// ============================================
// デバッグログ保存
// ============================================
function debugLog(message, data) {
  const log = {
    time: new Date().toISOString(),
    message: message,
    data: data
  };
  window.LESSQ_NOTIFICATION.debugLog.push(log);
  console.log('[防災lessQ]', message, data || '');
}

// ============================================
// 初期化
// ============================================
window.addEventListener('DOMContentLoaded', async () => {
  debugLog('プッシュ通知システム初期化開始');
  
  // iOS検出
  window.LESSQ_NOTIFICATION.isIOS = isIOS();
  debugLog('iOS検出', window.LESSQ_NOTIFICATION.isIOS);
  
  // Service Worker & PushManager チェック
  if (!('serviceWorker' in navigator)) {
    debugLog('❌ Service Worker非対応');
    return;
  }
  if (!('PushManager' in window)) {
    debugLog('❌ PushManager非対応');
    return;
  }
  
  debugLog('✅ Service Worker & PushManager対応');
  
  // Service Worker準備完了を待つ
  setTimeout(async () => {
    await checkAndShowModal();
  }, 2000);
  
  debugLog('初期化完了');
});

// ============================================
// iOS検出
// ============================================
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// ============================================
// 購読状況チェック
// ============================================
async function checkIfSubscribed() {
  try {
    debugLog('購読状況チェック開始');
    
    const registration = await navigator.serviceWorker.ready;
    debugLog('Service Worker準備完了', registration);
    
    const subscription = await registration.pushManager.getSubscription();
    const isSubscribed = subscription !== null;
    
    debugLog('購読状況', {
      isSubscribed: isSubscribed,
      subscription: subscription ? JSON.stringify(subscription) : null
    });
    
    return isSubscribed;
  } catch (error) {
    debugLog('❌ 購読確認エラー', error.message);
    console.error('[防災lessQ] 購読確認エラー:', error);
    return false;
  }
}

// ============================================
// モーダル表示判定
// ============================================
async function checkAndShowModal() {
  debugLog('モーダル表示判定開始');
  
  if (window.LESSQ_NOTIFICATION.modalShown) {
    debugLog('既に表示済み');
    return;
  }
  
  const isSubscribed = await checkIfSubscribed();
  
  if (isSubscribed) {
    debugLog('✅ 既に購読済み - モーダル不要');
    return;
  }
  
  // ★★★ iOSの場合のみモーダル表示 ★★★
  if (window.LESSQ_NOTIFICATION.isIOS) {
    debugLog('iOS & 未購読 - 必須モーダル表示');
    showMandatoryNotificationModal();
  } else {
    // Android: 自動で許可リクエスト
    debugLog('Android & 未購読 - 自動許可リクエスト');
    if (Notification.permission === 'default') {
      const permission = await Notification.requestPermission();
      debugLog('Android通知許可結果', permission);
      if (permission === 'granted') {
        await performSubscription();
      }
    } else if (Notification.permission === 'granted') {
      await performSubscription();
    }
  }
}

// ============================================
// 必須モーダル表示
// ============================================
function showMandatoryNotificationModal() {
  if (window.LESSQ_NOTIFICATION.modalShown) return;
  
  window.LESSQ_NOTIFICATION.modalShown = true;
  debugLog('必須モーダル表示開始');
  
  const modal = document.createElement('div');
  modal.className = 'notification-modal';
  modal.id = 'lessq-notification-modal';
  
  modal.innerHTML = `
    <div class="notification-modal-content" id="modal-content">
      <div class="notification-icon">
        <svg width="44" height="44" fill="white" viewBox="0 0 24 24">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
        </svg>
      </div>
      
      <h2 style="font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #1f2937;">
        通知の許可が必要です
      </h2>
      
      <p style="font-size: 15px; color: #6b7280; text-align: center; margin-bottom: 30px; line-height: 1.8;">
        防災情報や回覧板の配信をプッシュ通知でお知らせします。<br><br>
        <strong style="color: #374151;">ご利用には通知の許可が必要です。</strong>
      </p>
      
      <button id="allow-notification-btn" class="allow-button">
        通知を許可して続ける
      </button>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // 背景クリック無効化
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      e.preventDefault();
      e.stopPropagation();
      const content = document.getElementById('modal-content');
      content.classList.remove('shake');
      setTimeout(() => content.classList.add('shake'), 10);
      debugLog('背景クリック無効化');
    }
  });
  
  // ESCキー無効化
  const escapeHandler = (e) => {
    if (e.key === 'Escape' && document.getElementById('lessq-notification-modal')) {
      e.preventDefault();
      e.stopPropagation();
      const content = document.getElementById('modal-content');
      content.classList.remove('shake');
      setTimeout(() => content.classList.add('shake'), 10);
      debugLog('ESCキー無効化');
    }
  };
  document.addEventListener('keydown', escapeHandler, { capture: true });
  
  // 許可ボタン
  const allowButton = document.getElementById('allow-notification-btn');
  allowButton.addEventListener('click', async () => {
    debugLog('許可ボタンクリック');
    allowButton.disabled = true;
    allowButton.textContent = '処理中...';
    
    const success = await handleNotificationPermission();
    
    if (success) {
      debugLog('通知許可成功 - モーダルを閉じる');
      document.removeEventListener('keydown', escapeHandler, { capture: true });
      modal.remove();
      
      // ★★★ 成功メッセージ ★★★
      alert('✅ 通知設定が完了しました！\n\n回覧板などのすべてのシステムで通知が届くようになります。');
      
    } else {
      debugLog('通知許可失敗 - ボタン再有効化');
      allowButton.disabled = false;
      allowButton.textContent = '通知を許可して続ける';
    }
  });
  
  debugLog('モーダル表示完了');
}

// ============================================
// 通知許可処理
// ============================================
async function handleNotificationPermission() {
  try {
    debugLog('通知許可リクエスト開始');
    
    const permission = await Notification.requestPermission();
    debugLog('許可結果', permission);
    
    if (permission === 'granted') {
      debugLog('✅ 許可された');
      
      const subscribed = await performSubscription();
      
      if (subscribed) {
        debugLog('✅ 購読登録成功');
        return true;
      } else {
        debugLog('❌ 購読登録失敗');
        
        // ★★★ デバッグログを表示 ★★★
        const logs = window.LESSQ_NOTIFICATION.debugLog.map(log => 
          `${log.time}: ${log.message} ${log.data ? JSON.stringify(log.data) : ''}`
        ).join('\n');
        
        alert('⚠️ 購読登録に失敗しました。\n\n詳細:\n' + logs.slice(-500)); // 最後の500文字
        return false;
      }
      
    } else if (permission === 'denied') {
      debugLog('❌ 拒否された');
      alert('⚠️ 通知が拒否されました。\n\n防災lessQを利用するには通知の許可が必要です。\n\nデバイスの設定から通知を許可してください。');
      return false;
      
    } else {
      debugLog('⚠️ デフォルト（閉じられた）');
      alert('⚠️ 防災lessQを利用するには通知の許可が必要です。\n\nもう一度「許可」を選択してください。');
      return false;
    }
    
  } catch (error) {
    debugLog('❌ エラー', error.message);
    console.error('[防災lessQ] エラー:', error);
    alert('❌ エラーが発生しました:\n' + error.message + '\n\nStack:\n' + error.stack);
    return false;
  }
}

// ============================================
// 購読登録実行
// ============================================
async function performSubscription() {
  try {
    debugLog('購読登録開始');
    
    // Service Worker準備確認
    debugLog('Service Worker準備確認中');
    const registration = await navigator.serviceWorker.ready;
    debugLog('Service Worker準備完了', {
      scope: registration.scope,
      active: registration.active ? true : false
    });
    
    // VAPIDキー変換
    debugLog('VAPIDキー変換中');
    const convertedVapidKey = urlBase64ToUint8Array(window.LESSQ_NOTIFICATION.vapidPublicKey);
    debugLog('VAPIDキー変換完了', {
      length: convertedVapidKey.length
    });
    
    // プッシュ購読
    debugLog('pushManager.subscribe開始');
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: convertedVapidKey
    });
    
    debugLog('✅ ブラウザ購読成功', {
      endpoint: subscription.endpoint.slice(0, 50) + '...'
    });
    
    // localStorageに保存
    try {
      localStorage.setItem('lessq_push_subscription', JSON.stringify(subscription));
      debugLog('✅ localStorageに保存');
    } catch (e) {
      debugLog('⚠️ localStorage保存失敗', e.message);
    }
    
    return true;
    
  } catch (error) {
    debugLog('❌ 購読失敗', {
      message: error.message,
      stack: error.stack
    });
    console.error('[防災lessQ] 購読失敗:', error);
    return false;
  }
}

// ============================================
// ユーティリティ
// ============================================
function urlBase64ToUint8Array(base64String) {
  try {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
      .replace(/\-/g, '+')
      .replace(/_/g, '/');
    
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  } catch (error) {
    debugLog('❌ VAPIDキー変換エラー', error.message);
    throw error;
  }
}
